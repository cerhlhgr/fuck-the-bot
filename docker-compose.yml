services:
  bot:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN}
      TIMEWEB_AI_API_KEY: ${TIMEWEB_AI_API_KEY:?set TIMEWEB_AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-deepseek/deepseek-v4-pro}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      WEBHOOK_URL: https://${WEBHOOK_DOMAIN:?set WEBHOOK_DOMAIN}/telegram/webhook
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET}
      LISTEN_ADDR: :8080
